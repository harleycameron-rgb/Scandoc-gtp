name: SCANDOC Release Validation
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install -r requirements.txt
      - run: python -c "import server; assert server.mcp is not None"
      - name: Build source distribution archive
        run: |
          mkdir -p dist
          tar --exclude=.git --exclude=__pycache__ --exclude=dist -czf dist/scandoc-mcp-source.tar.gz .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scandoc-source
          path: dist/scandoc-mcp-source.tar.gz
          retention-days: 30
